<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衡练 AI 助手</title>
<style>
  :root{
    --coral:#FF5A2C; --coral-2:#FF7A4D; --coral-soft:#FFEDE6;
    --paper:#FAF7F3; --card:#FFFFFF; --ink:#1A1614; --ink-2:#4A423D;
    --muted:#8A7E76; --line:#EDE4DA; --ok:#12A150; --fail:#E5484D;
    --shadow:0 1px 2px rgba(26,22,20,.04), 0 8px 24px -12px rgba(26,22,20,.12);
    --radius:16px;
  }
  html[data-theme="dark"]{
    --coral:#FF6B3D; --coral-2:#FF8A5F; --coral-soft:#3A2018;
    --paper:#12100F; --card:#1C1917; --ink:#F5EFE9; --ink-2:#D6CCC4;
    --muted:#9A8E86; --line:#2C2724; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1320px; margin:0 auto; padding:22px 22px 40px}

  /* ---------- 头部横幅 ---------- */
  .banner{
    position:relative; overflow:hidden; border-radius:20px; padding:22px 26px;
    background:linear-gradient(120deg,#FF5A2C 0%,#FF7A4D 52%,#FFA072 100%);
    color:#fff; display:flex; align-items:center; justify-content:space-between; gap:18px;
    box-shadow:0 14px 34px -18px rgba(255,90,44,.75);
  }
  .banner::after{
    content:""; position:absolute; right:-70px; top:-90px; width:280px; height:280px;
    background:radial-gradient(circle,rgba(255,255,255,.30),transparent 68%); pointer-events:none;
  }
  .brand{display:flex; align-items:center; gap:14px; min-width:0}
  .logo{
    width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:grid;place-items:center;
    background:rgba(255,255,255,.22); font-size:24px; backdrop-filter:blur(4px);
  }
  .banner h1{margin:0; font-size:21px; letter-spacing:.4px; font-weight:800}
  .banner .sub{margin:3px 0 0; font-size:12.5px; opacity:.92; font-weight:500}
  .actions{display:flex; gap:8px; flex:0 0 auto}
  .ghost{
    border:1px solid rgba(255,255,255,.55); background:rgba(255,255,255,.14); color:#fff;
    padding:7px 13px; border-radius:10px; font-size:12.5px; cursor:pointer; font-weight:600;
    transition:transform .12s ease, background .18s ease;
  }
  .ghost:hover{background:rgba(255,255,255,.26)}
  .ghost:active{transform:scale(.96)}

  /* ---------- KPI ---------- */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:14px 0 0}
  .kpi{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px;
    box-shadow:var(--shadow); min-width:0;
  }
  .kpi .k{font-size:11.5px; color:var(--muted); letter-spacing:.6px; font-weight:600; text-transform:uppercase}
  .kpi .v{font-size:15px; font-weight:700; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .kpi .v small{font-weight:500; color:var(--muted); font-size:12px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--ok)}
  .dot.warn{background:#E8A33D}

  /* ---------- 栅格 ---------- */
  .grid{display:grid; grid-template-columns:minmax(0,1.62fr) minmax(0,1fr); gap:14px; margin-top:14px; align-items:start}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .card-hd{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; border-bottom:1px solid var(--line);
  }
  .card-hd h2{margin:0; font-size:14px; font-weight:750; letter-spacing:.3px}
  .hint{font-size:11.5px; color:var(--muted); font-weight:600}

  /* ---------- 对话 ---------- */
  .chat-card{display:flex; flex-direction:column; min-height:calc(100vh - 230px)}
  .chat{flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:16px; max-height:calc(100vh - 400px)}
  .chat::-webkit-scrollbar,.exec::-webkit-scrollbar{width:8px}
  .chat::-webkit-scrollbar-thumb,.exec::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px}

  .row{display:flex; gap:10px; align-items:flex-start; animation:up .28s ease both}
  .row.me{flex-direction:row-reverse}
  @keyframes up{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .avatar{
    width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:grid;place-items:center;
    font-size:16px; background:var(--coral-soft); border:1px solid var(--line);
  }
  .row.me .avatar{background:linear-gradient(135deg,var(--coral),var(--coral-2)); color:#fff; border:none}
  .bubble{max-width:min(78%,760px); min-width:0; padding:11px 14px; border-radius:14px; font-size:14.5px}
  .row.me .bubble{
    background:linear-gradient(135deg,var(--coral),var(--coral-2)); color:#fff;
    border-bottom-right-radius:5px; box-shadow:0 10px 22px -14px rgba(255,90,44,.9);
  }
  .row.ai .bubble{background:var(--paper); border:1px solid var(--line); border-bottom-left-radius:5px}
  html[data-theme="dark"] .row.ai .bubble{background:#171413}
  .bubble p{margin:0 0 8px}
  .bubble p:last-child{margin-bottom:0}
  .bubble h3,.bubble h4{margin:12px 0 6px; font-size:14.5px}
  .bubble ul,.bubble ol{margin:6px 0 8px; padding-left:20px}
  .bubble li{margin:2px 0}
  .bubble code{
    background:rgba(255,90,44,.11); color:var(--coral); padding:1px 5px; border-radius:5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
  }
  .row.me .bubble code{background:rgba(255,255,255,.24); color:#fff}
  .bubble pre{
    background:#1E1A18; color:#F5EFE9; padding:11px 13px; border-radius:10px; overflow-x:auto;
    font-size:12.5px; margin:8px 0; line-height:1.55;
  }
  .bubble pre code{background:none; color:inherit; padding:0}
  .bubble table{border-collapse:collapse; width:100%; margin:8px 0; font-size:13px}
  .bubble th,.bubble td{border:1px solid var(--line); padding:6px 9px; text-align:left}
  .bubble th{background:var(--coral-soft); font-weight:700}
  /* 内联展示生成的图片（直接显示，不再依赖外链） */
  .bubble img.gen{display:block; max-width:100%; width:auto; height:auto; margin:10px 0 2px;
    border-radius:14px; border:1px solid var(--line);
    box-shadow:0 6px 22px rgba(33,28,25,.10); background:var(--paper); cursor:zoom-in}
  .bubble img.gen.err{display:none}
  .meta{font-size:11px; color:var(--muted); margin:5px 0 0; font-weight:600}

  .empty{padding:26px 18px; color:var(--muted); font-size:13px; text-align:center; line-height:1.8}
  .empty b{color:var(--coral)}

  /* ---------- 输入区 ---------- */
  .composer{display:flex; gap:9px; padding:12px 14px; border-top:1px solid var(--line); align-items:flex-end}
  textarea{
    flex:1; resize:none; min-height:46px; max-height:150px; padding:11px 13px; border-radius:12px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); font:inherit; font-size:14px;
    outline:none; transition:border-color .16s ease, box-shadow .16s ease;
  }
  html[data-theme="dark"] textarea{background:#171413}
  textarea:focus{border-color:var(--coral); box-shadow:0 0 0 3px rgba(255,90,44,.13)}
  .primary{
    border:none; border-radius:12px; padding:0 20px; height:46px; cursor:pointer; color:#fff; font-weight:700;
    background:linear-gradient(135deg,var(--coral),var(--coral-2)); font-size:14px;
    box-shadow:0 10px 22px -12px rgba(255,90,44,.9); transition:transform .12s ease, filter .18s ease;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .primary:hover{filter:brightness(1.05)}
  .primary:active{transform:scale(.96)}
  .primary:disabled{opacity:.55; cursor:not-allowed; box-shadow:none}
  .chips{display:flex; flex-wrap:wrap; gap:7px; padding:0 14px 14px}
  .chip{
    border:1px dashed var(--line); background:transparent; color:var(--ink-2); font-size:12px;
    padding:6px 11px; border-radius:999px; cursor:pointer; transition:all .16s ease; font-family:inherit;
  }
  .chip:hover{border-color:var(--coral); color:var(--coral); background:var(--coral-soft); border-style:solid}

  /* ---------- 右侧 ---------- */
  .side{display:flex; flex-direction:column; gap:14px; min-width:0}
  .exec{padding:12px 14px; max-height:400px; overflow-y:auto; display:flex; flex-direction:column; gap:9px}
  .step{border:1px solid var(--line); border-radius:11px; padding:9px 11px; background:var(--paper); animation:up .24s ease both}
  html[data-theme="dark"] .step{background:#171413}
  .step-hd{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700}
  .idx{
    width:19px;height:19px;flex:0 0 19px;border-radius:6px;display:grid;place-items:center;
    background:var(--coral-soft); color:var(--coral); font-size:11px; font-weight:800;
  }
  .tag{margin-left:auto; font-size:10.5px; padding:1px 7px; border-radius:999px; font-weight:700}
  .tag.ok{background:rgba(18,161,80,.12); color:var(--ok)}
  .tag.fail{background:rgba(229,72,77,.12); color:var(--fail)}
  .args{
    margin:6px 0 0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted);
    word-break:break-all; line-height:1.6;
  }
  .step details{margin-top:5px}
  .step summary{cursor:pointer; font-size:11.5px; color:var(--coral); font-weight:600; list-style:none}
  .step summary::-webkit-details-marker{display:none}
  .step pre{
    margin:6px 0 0; background:#1E1A18; color:#E9E1DA; padding:9px 10px; border-radius:8px;
    font-size:11px; overflow-x:auto; max-height:190px; line-height:1.5;
  }
  .tools{padding:10px 12px; display:flex; flex-wrap:wrap; gap:6px}
  .tool{
    font-size:11.5px; padding:4px 9px; border-radius:8px; background:var(--coral-soft); color:var(--coral);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:600;
  }
  select{
    width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); font:inherit; font-size:13px; outline:none; margin:0 0 9px;
  }
  html[data-theme="dark"] select{background:#171413}
  .wide{width:100%; border-color:var(--line); background:var(--coral-soft); color:var(--coral); padding:9px 13px}
  .wide:hover{background:var(--coral); color:#fff; border-color:var(--coral)}
  .pad{padding:12px 14px 14px}

  /* ---------- 加载 / 提示 ---------- */
  .typing{display:flex; gap:5px; align-items:center; padding:3px 2px}
  .typing i{width:6px;height:6px;border-radius:50%; background:var(--coral); animation:blink 1.05s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes blink{0%,80%,100%{opacity:.25; transform:translateY(0)} 40%{opacity:1; transform:translateY(-3px)}}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); opacity:0; pointer-events:none;
    background:#1E1A18; color:#fff; padding:9px 17px; border-radius:11px; font-size:13px; font-weight:600;
    transition:all .24s ease; z-index:99; box-shadow:0 12px 30px -12px rgba(0,0,0,.6);
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .err{color:var(--fail); font-size:13px}

  @media (max-width:980px){
    .grid{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .chat{max-height:none}
    .app{padding:14px}
  }
</style>
</head>
<body>
<div class="app">

  <header class="banner">
    <div class="brand">
      <div class="logo">💪</div>
      <div>
        <h1>衡练 AI 助手</h1>
        <p class="sub">训练评估 · 饮食规划 · 数据推演 · 动作示意图 —— 工具调用全过程可解释的健身 Agent</p>
      </div>
    </div>
    <div class="actions">
      <button id="themeBtn" class="ghost" title="切换主题">🌙 深色</button>
      <button id="saveBtn" class="ghost" title="保存当前会话">保存会话</button>
    </div>
  </header>

  <section class="kpis">
    <div class="kpi"><div class="k">大模型</div><div class="v" id="kModel">—</div></div>
    <div class="kpi"><div class="k">Agent 后端</div><div class="v" id="kBackend">—</div></div>
    <div class="kpi"><div class="k">可用工具</div><div class="v" id="kTools">—</div></div>
    <div class="kpi"><div class="k">API 密钥</div><div class="v" id="kKey">—</div></div>
  </section>

  <main class="grid">
    <section class="card chat-card">
      <div class="card-hd">
        <h2>对话</h2>
        <span class="hint" id="msgCount">尚未开始</span>
      </div>
      <div class="chat" id="chat">
        <div class="empty">
          你好，我是 <b>衡练 AI 助手</b>。<br>
          告诉我今天练了什么、吃了什么，或者你想达到的目标，<br>
          我会调用体能评估、饮食规划、1RM 估算、减重推演等工具给出可执行的建议。
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="例如：我今天练了90分钟力量，平均心率125，消耗500千卡，帮我评估并安排明天训练"></textarea>
        <button id="sendBtn" class="primary">发送 <span>↵</span></button>
      </div>
    </section>

    <aside class="side">
      <section class="card">
        <div class="card-hd"><h2>执行过程</h2><span class="hint" id="execHint">等待提问</span></div>
        <div class="exec" id="exec">
          <div class="empty">提问后，这里会展示 Agent 调用了哪些工具、传入什么参数、返回什么结果。</div>
        </div>
      </section>

      <section class="card">
        <div class="card-hd"><h2>工具清单</h2><span class="hint" id="toolCount"></span></div>
        <div class="tools" id="tools"></div>
      </section>

      <section class="card">
        <div class="card-hd"><h2>历史会话</h2><span class="hint">JSON 落盘</span></div>
        <div class="pad">
          <select id="sessions"><option>加载中…</option></select>
          <button id="loadBtn" class="ghost wide">载入所选会话</button>
        </div>
      </section>
    </aside>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const state = { history: [], events: [], busy: false, config: null };

const $ = (id) => document.getElementById(id);
const chatEl = $("chat"), execEl = $("exec"), inputEl = $("input"), sendBtn = $("sendBtn");

/* 托管网关用 sharecode 鉴权：页面首次加载后网关会下发 Cookie，
   但为稳妥起见，接口调用一并带上 URL 里的 sharecode。 */
const SHARE = new URLSearchParams(location.search).get("sharecode");
function api(path){
  if (!SHARE) return path;
  return path + (path.indexOf("?") >= 0 ? "&" : "?") + "sharecode=" + encodeURIComponent(SHARE);
}

const DEMO = [
  "我今天练了90分钟力量，平均心率125，消耗500千卡，帮我评估一下并安排明天的训练",
  "帮我规划明天一天的饮食：我75公斤、175cm、25岁，目标是增肌",
  "我现在75公斤，如果每周练4次、每天少吃500千卡，8周后体重大概多少？",
  "帮我画一张标准的杠铃深蹲动作示意图"
];

/* ---------------- 工具函数 ---------------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}
function scrollChat(){ chatEl.scrollTop = chatEl.scrollHeight; }

/* 轻量 Markdown：标题 / 粗体 / 行内代码 / 代码块 / 列表 / 表格 */
function md(src){
  const blocks = [];
  let s = String(src || "").replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push('<pre><code>' + esc(code.replace(/\n$/, "")) + '</code></pre>');
    return "\u0000B" + (blocks.length - 1) + "\u0000";
  });

  const lines = s.split("\n");
  const out = [];
  let list = null, table = null;

  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");

  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  const closeTable = () => {
    if (table) {
      let html = "<table><thead><tr>";
      table.head.forEach(h => html += "<th>" + inline(h) + "</th>");
      html += "</tr></thead><tbody>";
      table.rows.forEach(r => {
        html += "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>";
      });
      out.push(html + "</tbody></table>");
      table = null;
    }
  };

  for (let raw of lines) {
    const line = raw.trimEnd();
    const ph = line.match(/^\u0000B(\d+)\u0000$/);
    if (ph) { closeList(); closeTable(); out.push(blocks[+ph[1]]); continue; }
    if (!line.trim()) { closeList(); closeTable(); continue; }

    // 表格
    if (/^\|.*\|$/.test(line.trim())) {
      const cells = line.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      if (!table) { closeList(); table = { head: cells, rows: [] }; }
      else table.rows.push(cells);
      continue;
    }
    closeTable();

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); out.push("<h3>" + inline(h[2]) + "</h3>"); continue; }

    const ul = line.match(/^\s*[-*·]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.、)]\s+(.*)$/);
    if (ul || ol) {
      const kind = ul ? "ul" : "ol";
      if (list !== kind) { closeList(); out.push("<" + kind + ">"); list = kind; }
      out.push("<li>" + inline((ul || ol)[1]) + "</li>");
      continue;
    }
    closeList();
    out.push("<p>" + inline(line) + "</p>");
  }
  closeList(); closeTable();
  return out.join("");
}

/* ---------------- 渲染 ---------------- */
function addMsg(role, text){
  const empty = chatEl.querySelector(".empty");
  if (empty) empty.remove();

  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "me" : "ai");

  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = role === "user" ? "我" : "🤖";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "user") bubble.innerHTML = md(text);
  else {
    bubble.innerHTML = md(text);
    const meta = document.createElement("div");
    meta.className = "meta";
    const model = state.config ? state.config.model : "";
    meta.textContent = "衡练 Agent" + (model ? " · " + model : "");
    bubble.appendChild(meta);
  }

  row.appendChild(av); row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollChat();
  return row;
}

/* 本轮若生成了图片，直接用后端返回的 data-URI 内联展示（无需再请求本地文件/接口） */
function appendImages(row, images){
  if (!row || !images || !images.length) return;
  const bubble = row.querySelector(".bubble");
  if (!bubble) return;
  images.forEach(im => {
    const img = document.createElement("img");
    img.className = "gen";
    img.alt = im.name || "生成的图片";
    img.loading = "lazy";
    img.src = "data:" + (im.mime || "image/png") + ";base64," + im.data;
    bubble.appendChild(img);
  });
}

function typingRow(){
  const row = document.createElement("div");
  row.className = "row ai"; row.id = "typingRow";
  row.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
  chatEl.appendChild(row); scrollChat();
}

function renderEvents(events){
  if (!events || !events.length) {
    execEl.innerHTML = '<div class="empty">本轮未调用工具，模型直接作答。</div>';
    $("execHint").textContent = "0 次调用";
    return;
  }
  execEl.innerHTML = "";
  let n = 0;
  events.forEach(ev => {
    const step = document.createElement("div");
    step.className = "step";
    if (ev.type === "tool_call") {
      n++;
      const argsText = ev.args || "{}";
      step.innerHTML =
        '<div class="step-hd"><span class="idx">' + n + '</span>' +
        '<span>' + esc(ev.name) + '</span>' +
        '<span class="tag">调用</span></div>' +
        '<div class="args">' + esc(argsText.length > 180 ? argsText.slice(0, 180) + "…" : argsText) + '</div>';
    } else {
      const ok = ev.ok !== false;
      const json = JSON.stringify(ev.result, null, 2);
      const brief = json.length > 240 ? json.slice(0, 240) + "…" : json;
      step.innerHTML =
        '<div class="step-hd"><span class="idx">↳</span>' +
        '<span>' + esc(ev.name) + '</span>' +
        '<span class="tag ' + (ok ? "ok" : "fail") + '">' + (ok ? "成功" : "失败") + '</span></div>' +
        '<details><summary>查看返回</summary><pre>' + esc(json) + '</pre></details>' +
        '<div class="args">' + esc(brief) + '</div>';
    }
    execEl.appendChild(step);
  });
  const calls = events.filter(e => e.type === "tool_call").length;
  $("execHint").textContent = calls + " 次调用";
  execEl.scrollTop = 0;
}

function updateCount(){
  const turns = state.history.filter(m => m.role === "user").length;
  $("msgCount").textContent = turns ? turns + " 轮对话" : "尚未开始";
}

/* ---------------- 发送 ---------------- */
async function send(text){
  text = (text || inputEl.value).trim();
  if (!text || state.busy) return;

  inputEl.value = ""; inputEl.style.height = "auto";
  addMsg("user", text);
  state.busy = true; sendBtn.disabled = true;
  typingRow();
  $("execHint").textContent = "执行中…";

  try {
    const resp = await fetch(api("/api/chat"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: state.history })
    });
    const data = await resp.json();
    const tr = document.getElementById("typingRow");
    if (tr) tr.remove();

    if (!resp.ok || data.error) {
      addMsg("assistant", "**出错了**：" + (data.error || ("HTTP " + resp.status)));
      $("execHint").textContent = "失败";
      return;
    }
    const aiRow = addMsg("assistant", data.reply);
    appendImages(aiRow, data.images || []);
    renderEvents(data.events);
    state.history = data.history || [];
    updateCount();
  } catch (e) {
    const tr = document.getElementById("typingRow");
    if (tr) tr.remove();
    addMsg("assistant", "**网络异常**：" + e.message + "\n\n请确认服务是否已启动。");
    $("execHint").textContent = "失败";
  } finally {
    state.busy = false; sendBtn.disabled = false; inputEl.focus();
  }
}

/* ---------------- 初始化 ---------------- */
async function boot(){
  // 示例话术
  const chips = $("chips");
  DEMO.forEach(p => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = p.length > 26 ? p.slice(0, 26) + "…" : p;
    b.title = p;
    b.onclick = () => send(p);
    chips.appendChild(b);
  });

  // 配置
  try {
    const cfg = await (await fetch(api("/api/config"))).json();
    state.config = cfg;
    $("kModel").textContent = cfg.model || "—";
    $("kBackend").textContent = (cfg.backend || "").split("（")[0] || "—";
    $("kBackend").title = cfg.backend || "";
    $("kTools").innerHTML = (cfg.tools || []).length + " <small>个 · 可调用</small>";
    $("kKey").innerHTML = cfg.has_api_key
      ? '<span class="dot"></span>已配置'
      : '<span class="dot warn"></span>未配置';
    $("toolCount").textContent = (cfg.tools || []).length + " 个";
    $("tools").innerHTML = (cfg.tools || []).map(t => '<span class="tool">' + esc(t) + "</span>").join("");
  } catch (e) {
    toast("读取配置失败：" + e.message);
  }

  // 会话列表
  await refreshSessions();
  inputEl.focus();
}

async function refreshSessions(){
  try {
    const data = await (await fetch(api("/api/sessions"))).json();
    const sel = $("sessions");
    if (!data.sessions || !data.sessions.length) {
      sel.innerHTML = "<option value=''>暂无已保存会话</option>";
      return;
    }
    sel.innerHTML = data.sessions.map(f => '<option value="' + esc(f) + '">' + esc(f) + "</option>").join("");
  } catch (e) { /* 静默 */ }
}

/* ---------------- 事件绑定 ---------------- */
sendBtn.onclick = () => send();

inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
});

$("themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  $("themeBtn").textContent = dark ? "🌙 深色" : "☀️ 浅色";
  try { localStorage.setItem("hl_theme", dark ? "light" : "dark"); } catch (e) {}
};

$("saveBtn").onclick = async () => {
  if (!state.history.length) return toast("当前还没有可保存的对话");
  try {
    const r = await fetch(api("/api/sessions"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ history: state.history })
    });
    const d = await r.json();
    if (d.filename) { toast("已保存：" + d.filename); refreshSessions(); }
    else toast("保存失败");
  } catch (e) { toast("保存失败：" + e.message); }
};

$("loadBtn").onclick = async () => {
  const fname = $("sessions").value;
  if (!fname) return toast("没有可载入的会话");
  try {
    const r = await fetch(api("/api/session/load"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: fname })
    });
    const d = await r.json();
    if (d.error) return toast(d.error);
    state.history = d.history || [];
    chatEl.innerHTML = "";
    state.history.forEach(m => addMsg(m.role === "user" ? "user" : "assistant", m.content));
    renderEvents([]);
    updateCount();
    toast("已载入 " + fname);
  } catch (e) { toast("载入失败：" + e.message); }
};

// 恢复主题
try {
  const saved = localStorage.getItem("hl_theme");
  if (saved === "dark") {
    document.documentElement.dataset.theme = "dark";
    $("themeBtn").textContent = "☀️ 浅色";
  }
} catch (e) {}

boot();
</script>
</body>
